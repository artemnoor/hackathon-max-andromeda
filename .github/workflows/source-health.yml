name: source-health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: andromeda_health
          POSTGRES_USER: andromeda_health
          POSTGRES_PASSWORD: source-health-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andromeda_health -d andromeda_health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ANDROMEDA_ENV: staging
      ANDROMEDA_DATABASE_URL: postgresql+psycopg://andromeda_health:source-health-ci-only@localhost:5432/andromeda_health
      FRONTEND_ORIGIN: https://andromeda.example.org
      ANDROMEDA_OPS_API_KEY: source-health-ci-ephemeral-key
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install backend
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.28
          uv sync --locked --extra dev --extra browser
        working-directory: backend
      - name: Install browser fallback
        run: uv run --locked --extra dev --extra browser playwright install --with-deps chromium
        working-directory: backend
      - name: Migrate ephemeral health database
        run: uv run --locked --extra dev --extra browser python -m alembic upgrade head
        working-directory: backend
      - name: Record BMSTU source redirect headers
        run: |
          curl --silent --show-error --max-time 30 \
            --dump-header "$RUNNER_TEMP/bmstu-source-headers.txt" \
            --output /dev/null https://bmstu.ru/sveden/common || true
          sed -n '1,40p' "$RUNNER_TEMP/bmstu-source-headers.txt"
      - name: Run live source health
        run: uv run --locked --extra dev --extra browser python scripts/source_health.py --artifact "$GITHUB_WORKSPACE/source-health.json"
        working-directory: backend
      - name: Upload source health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health
          path: |
            source-health.json
            ${{ runner.temp }}/bmstu-source-headers.txt
