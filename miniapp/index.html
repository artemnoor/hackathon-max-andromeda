<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f7fb">
    <title>Andromeda · MAX foundation</title>
    <link rel="stylesheet" href="/styles.css">
    <script defer src="https://st.max.ru/js/max-web-app.js"></script>
    <script type="module" src="/app.js"></script>

  <body>
    <main class="shell" aria-labelledby="page-title">
      <p class="eyebrow">HACKATHON FOUNDATION</p>

      <section class="status-card" aria-labelledby="status-heading">

          <h2 id="status-heading">Статус запуска</h2>
          <p id="status" role="status" aria-live="polite">Проверяем доступность MAX Bridge…</p>
        </div>
      </section>

      <p class="boundary-note">Проверка MAX запуска не связывает пользователя с аккаунтом Andromeda.</p>
      <footer>MAX Bot · Mini App transport</footer>
    </main>
