schemaVersion: "1.0"

solution:
  name: "Andromeda"

api:
  baseUrl: "https://max.code-slicer.ru"
  openapi: "./openapi.json"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health-live"
    name: "Public API v1 liveness"
    method: "GET"
    path: "/api/v1/health/live"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status"]
      bodySchema:
        type: "object"
        required: ["status"]
        properties:
          status:
            const: "live"
    timeoutMs: 5000
    repeatable: true

  - id: "universities-list"
    name: "Discover universities"
    method: "GET"
    path: "/api/v1/universities"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["items"]
      bodySchema:
        type: "object"
        required: ["items"]
        properties:
          items:
            type: "array"
            minItems: 1
    timeoutMs: 5000
    repeatable: true

  - id: "programs-list"
    name: "List canonical programs"
    method: "GET"
    path: "/api/v1/programs"
    role: "public"
    dependsOn: ["universities-list"]
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["items"]
      bodySchema:
        type: "object"
        required: ["items"]
        properties:
          items:
            type: "array"
            minItems: 1
    timeoutMs: 5000
    repeatable: true

  - id: "program-a-details"
    name: "Read BMSTU program details"
    method: "GET"
    path: "/api/v1/programs/{id}"
    role: "public"
    dependsOn: ["programs-list"]
    request:
      path:
        id: "program:bmstu:09.03.01-02"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["program"]
      bodySchema:
        type: "object"
        required: ["program"]
        properties:
          program:
            type: "object"
            required: ["id", "name", "universityId"]
    timeoutMs: 5000
    repeatable: true
    extract:
      programA: "$.program.id"

  - id: "program-b-details"
    name: "Read comparison program details"
    method: "GET"
    path: "/api/v1/programs/{id}"
    role: "public"
    dependsOn: ["programs-list"]
    request:
      path:
        id: "program:bmstu:09.03.01-12"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["program"]
      bodySchema:
        type: "object"
        required: ["program"]
        properties:
          program:
            type: "object"
            required: ["id", "name", "universityId"]
    timeoutMs: 5000
    repeatable: true
    extract:
      programB: "$.program.id"

  - id: "program-a-curriculum"
    name: "Read program curriculum"
    method: "GET"
    path: "/api/v1/programs/{id}/curriculum"
    role: "public"
    dependsOn: ["program-a-details"]
    request:
      path:
        id: "${programA}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["program", "curriculumId", "educationYear", "items"]
      bodySchema:
        type: "object"
        required: ["program", "curriculumId", "educationYear", "items"]
    timeoutMs: 10000
    repeatable: true

  - id: "program-a-admissions"
    name: "Read source-backed admissions data"
    method: "GET"
    path: "/api/v1/programs/{id}/admissions"
    role: "public"
    dependsOn: ["program-a-details"]
    request:
      path:
        id: "${programA}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["program", "programId", "offerings"]
      bodySchema:
        type: "object"
        required: ["program", "programId", "offerings"]
    timeoutMs: 10000
    repeatable: true

  - id: "program-comparison"
    name: "Compare two canonical BMSTU programs"
    method: "GET"
    path: "/api/v1/compare"
    role: "public"
    dependsOn: ["program-a-details", "program-b-details"]
    request:
      query:
        programIds: "${programA},${programB}"
        scope: "all"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["programA", "programB", "scope", "rows", "totalsA", "totalsB"]
      bodySchema:
        type: "object"
        required: ["programA", "programB", "scope", "rows", "totalsA", "totalsB"]
    timeoutMs: 10000
    repeatable: true

  - id: "assistant-policy-query"
    name: "Query the deterministic source-backed policy path"
    description: >-
      This recognized policy question uses the deterministic parser and
      fail-closed knowledge response path; it does not require Jev or an LLM.
    method: "POST"
    path: "/api/v1/assistant/query"
    role: "public"
    dependsOn: ["health-live"]
    request:
      headers:
        Content-Type: "application/json"
      body:
        text: "Правда ли, что с 2028 года введут четвертый ЕГЭ?"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["state", "session_id", "revision", "response"]
      bodySchema:
        type: "object"
        required: ["state", "session_id", "revision", "response"]
    timeoutMs: 10000
    repeatable: false
