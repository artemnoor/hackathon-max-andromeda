[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-backend"
version = "0.1.0"
description = "Source-backed Andromeda decision-support backend and university ingestion adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "PyMuPDF>=1.24",
  "pdfplumber>=0.11",
  "pypdf>=3.17",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
evaluation = [
    "system-one-adapter==0.2.0",
    "jevcal @ git+https://github.com/abhixhek/jevcal@ae8f3144d69c9cb0e5e0a2c17f70b9d14714cb9f",
    "jev-align @ git+https://github.com/sutro-sh/jev-align@3d997fc76593036655c28d4964de43b55f81fe2c",
]
jev = [
    "typesafe-sdk==0.7.1",
    "jevcal @ git+https://github.com/abhixhek/jevcal@ae8f3144d69c9cb0e5e0a2c17f70b9d14714cb9f",
]
jevql = [
    "jevql @ git+https://github.com/kylemclaren/jevql@274532af852e8edfb7715ec6dca1113e589cb191#subdirectory=sdk/python",
]
dev = [
    "jsonschema>=4.22",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/andromeda"]
