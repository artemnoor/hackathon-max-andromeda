#cloud-config
users:
  - default
  - name: yc-user
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDQfAWNII0dHbQle3qus3LqyzvNprGGKXGOUBsfp4S7C Артём@DESKTOP-MIBNS7H

package_update: true
packages:
  - ca-certificates
  - curl
  - nginx
  - python3.11-venv
  - unzip

write_files:
  - path: /etc/nginx/sites-available/andromeda
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;
          client_max_body_size 2m;
          location /api/v1/ {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_pass http://127.0.0.1:8020/api/v1/;
          }
          location = /api {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_pass http://127.0.0.1:8020/;
          }
          location /api/ {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_pass http://127.0.0.1:8020/;
          }
          location / {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://127.0.0.1:3000;
          }
      }

  - path: /etc/systemd/system/andromeda-backend.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Andromeda FastAPI backend
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=simple
      WorkingDirectory=/opt/andromeda/release/backend
      Environment=PYTHONPATH=/opt/andromeda/release/backend/src
      EnvironmentFile=-/etc/andromeda/backend.env
      Environment=ANDROMEDA_ENV=staging
      Environment=FRONTEND_ORIGIN=http://127.0.0.1
      Environment=LOG_LEVEL=INFO
      Environment=ANDROMEDA_DB_POOL_SIZE=5
      Environment=ANDROMEDA_DB_MAX_OVERFLOW=10
      ExecStart=/opt/andromeda/venv/bin/uvicorn andromeda.api.main:app --host 127.0.0.1 --port 8020
      Restart=on-failure
      RestartSec=5
      User=andromeda
      Group=andromeda
      NoNewPrivileges=true
      PrivateTmp=true
      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/andromeda-frontend.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Andromeda Next.js frontend
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=simple
      WorkingDirectory=/opt/andromeda/release/frontend-runtime/.next/standalone
      Environment=NODE_ENV=production
      Environment=HOSTNAME=127.0.0.1
      Environment=PORT=3000
      ExecStart=/usr/bin/node /opt/andromeda/release/frontend-runtime/.next/standalone/server.js
      Restart=on-failure
      RestartSec=5
      User=andromeda
      Group=andromeda
      NoNewPrivileges=true
      PrivateTmp=true
      [Install]
      WantedBy=multi-user.target

runcmd:
  - [bash, -lc, "curl -fsSL https://deb.nodesource.com/setup_22.x | bash -"]
  - [apt-get, install, -y, nodejs]
  - [useradd, --system, --home-dir, /opt/andromeda, --create-home, --shell, /usr/sbin/nologin, andromeda]
  - [mkdir, -p, /opt/andromeda/release, /opt/andromeda/release/frontend-runtime, /opt/andromeda/data]
  - [ln, -sfn, /etc/nginx/sites-available/andromeda, /etc/nginx/sites-enabled/andromeda]
  - [rm, -f, /etc/nginx/sites-enabled/default]
  - [nginx, -t]
  - [systemctl, enable, nginx]
  - [systemctl, restart, nginx]
