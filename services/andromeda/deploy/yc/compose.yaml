services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ANDROMEDA_STAGING_DB}
      POSTGRES_USER: ${ANDROMEDA_STAGING_DB_USER}
      POSTGRES_PASSWORD: ${ANDROMEDA_STAGING_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ANDROMEDA_ENV: staging
      ANDROMEDA_DATABASE_URL: postgresql+psycopg://${ANDROMEDA_STAGING_DB_USER}:${ANDROMEDA_STAGING_DB_PASSWORD}@postgres:5432/${ANDROMEDA_STAGING_DB}
      FRONTEND_ORIGIN: ${ANDROMEDA_FRONTEND_ORIGIN:-https://${ANDROMEDA_DOMAIN}}
      ANDROMEDA_OPS_API_KEY: ${ANDROMEDA_OPS_API_KEY}
      LOG_LEVEL: INFO
      ANDROMEDA_DB_POOL_SIZE: 5
      ANDROMEDA_DB_MAX_OVERFLOW: 10
      JEV_ENABLED: "${JEV_ENABLED:-false}"
      JEV_SHADOW_ENABLED: "${JEV_SHADOW_ENABLED:-false}"
      JEV_CALIBRATION_ENABLED: "${JEV_CALIBRATION_ENABLED:-false}"
      JEV_CALIBRATION_MODE: "${JEV_CALIBRATION_MODE:-production}"
      JEV_CALIBRATION_LOCK_PATH: "${JEV_CALIBRATION_LOCK_PATH:-/app/config/jev/locks/next-action.typesafe-jev.v2.lock.json}"
      JEV_CALIBRATION_MAX_AGE_SECONDS: "${JEV_CALIBRATION_MAX_AGE_SECONDS:-7776000}"
      JEV_RUNTIME_PROVIDER: "${JEV_RUNTIME_PROVIDER:-typesafe}"
      JEV_ENDPOINT: "${JEV_ENDPOINT:-https://polza.ai/api}"
      JEV_MODEL: "${JEV_MODEL:-typesafe/jev}"
      TYPESAFE_API_KEY: "${TYPESAFE_API_KEY:-}"
      JEV_API_KEY: "${JEV_API_KEY:-}"
    volumes:
      - andromeda_data:/app/data

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ANDROMEDA_INTERNAL_API_URL: http://backend:8020
      ANDROMEDA_RENDER_HMAC_SECRET: ${ANDROMEDA_RENDER_HMAC_SECRET}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      ANDROMEDA_DOMAIN: ${ANDROMEDA_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../openapi.json:/srv/openapi.json:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  andromeda_data:
  caddy_data:
  caddy_config:
